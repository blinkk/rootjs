                    text: "Routes read CMS content on the server with <code>RootCMSClient</code>, in <code>getStaticProps()</code> (SSG) or <code>handle()</code> (SSR). Create a client with the <code>rootConfig</code> from the request or context."
                - type: "paragraph"
