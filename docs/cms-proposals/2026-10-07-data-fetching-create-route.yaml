          - id: "batch-requests"
            title: "Batch requests"
            body:
              blocks:
                - type: "paragraph"
                  data:
                    text: "Every read from the CMS is a round trip to Firestore. A batch request combines the reads a page needs: its docs, queries and data sources are fetched in parallel, then the translations for every doc in the batch are fetched together, for the page's locale only."
                - type: "paragraph"
                  data:
                    text: "In <code>createRoute()</code>, add reads with the <code>batchRequest</code> option. They're fetched in the same batch as the route's doc. The response is available as <code>ctx.batchResponse</code>, e.g. in <code>preRenderHook</code>, which passes it to the page as props:"
              time: 1791386039872
              version: "2.28.2"
            blocks:
              - _type: "CodeBlock"
                language: "tsx"
                code: |-
                  export const {handle} = createRoute({
                    collection: 'Pages',
                    slugParam: 'slug',
                    batchRequest: (req) => {
                      req.addDoc('Global/header');
                      req.addQuery('posts', 'BlogPosts', {limit: 3});
                      req.addDataSource('pricing');
                    },
                    preRenderHook: (props, ctx) => ({
                      ...props,
                      header: ctx.batchResponse!.docs['Global/header'],
                      posts: ctx.batchResponse!.queries.posts,
                      pricing: ctx.batchResponse!.dataSources.pricing,
                    }),
                  });
              - _type: "CopyBlock"
                body:
                  blocks:
                    - type: "paragraph"
                      data:
                        text: "The response's <code>docs</code> are keyed by doc id, its <code>queries</code> by the id you passed to <code>addQuery()</code>, and its <code>dataSources</code> by data source id."
                  time: 1791386039872
                  version: "2.28.2"
          - id: "batch-requests-outside-routes"
            title: "Batch requests outside a route"
            body:
              blocks:
                - type: "paragraph"
                  data:
                    text: "In a custom handler, <code>getStaticProps()</code> or a plugin, create a batch request with <code>cmsClient.createBatchRequest()</code>. With <code>translate: true</code>, it also loads the translations for the docs it returns, for the <code>locales</code> you pass:"
              time: 1791386039872
              version: "2.28.2"
            blocks:
              - _type: "CodeBlock"
                language: "ts"
                code: |-
                  import {RootCMSClient} from '@blinkk/root-cms';

                  const cmsClient = new RootCMSClient(rootConfig);
                  const req = cmsClient.createBatchRequest({
                    mode: 'published',
                    translate: true,
                    locales: [locale],
                  });
                  req.addDoc('Pages/index');
                  req.addTranslations('common');
                  const res = await req.fetch();

                  const doc = res.docs['Pages/index'];
                  const translations = res.getTranslations(locale);
              - _type: "CopyBlock"
