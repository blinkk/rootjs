                    - type: "paragraph"
                      data:
                        text: "<b>4. Secure the database and add yourself as an admin</b>"
                    - type: "paragraph"
                      data:
                        text: "Run <code>init-firebase</code> to apply the CMS's Firestore security rules and give your account the ADMIN role:"
                  time: 1790730406815
                  version: "2.28.2"
                _arrayKey: "3VoxMD"
              - _type: "CodeBlock"
                language: "bash"
