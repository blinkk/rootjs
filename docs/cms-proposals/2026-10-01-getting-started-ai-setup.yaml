                body:
                  blocks:
                    - type: "paragraph"
                      data:
                        text: "The route at <code>routes/[[...slug]].tsx</code> loads the doc for the URL with <code>RootCMSClient</code>, and <code>PageModules</code> renders each module with the component that matches its template name. Editors can preview drafts by adding <code>?preview=true</code> to the URL."
                    - type: "paragraph"
                      data:
                        text: "To add a template, create a folder in <code>templates/</code> with a schema and a component of the same name. For example, here's the starter's <code>Text</code> template:"
                  time: 1790730406815
                  version: "2.28.2"
                _arrayKey: "XFChp5"
              - _type: "CodeBlock"
                language: "ts"
                code: |-
                  // @/templates/Text/Text.schema.ts

                  import {schema} from '@blinkk/root-cms';

                  export default schema.define({
                    name: 'Text',
                    description: 'Heading and body copy.',
                    fields: [
                      schema.string({
                        id: 'title',
                        label: 'Title',
                        translate: true,
                      }),
                      schema.string({
                        id: 'body',
                        label: 'Body',
                        help: 'Separate paragraphs with a blank line.',
