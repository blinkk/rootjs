          - id: "set-up-cms"
            title: "Connect the CMS to Firebase"
            body:
              blocks:
                - type: "paragraph"
                  data:
                    text: "The CMS runs inside your site at <code>/cms/</code> and stores content in Firestore. The starter's <code>root.config.ts</code> has placeholder Firebase values, so connect your own project first."
                - type: "paragraph"
                  data:
                    text: "<b>1. Create a Firebase project</b>"
                - type: "orderedList"
                  data:
                    style: "ordered"
                    items:
                      - content: "Create a project in the <a href=\"https://console.firebase.google.com/\">Firebase console</a>, or add Firebase to an existing Google Cloud project."
                        items: []
                      - content: "Create a Firestore database in <b>Native mode</b>."
                        items: []
                      - content: "Under <b>Authentication</b>, enable the <b>Google</b> sign-in provider. If your site will serve on a custom domain, add it to the authorized domains."
                        items: []
                      - content: "Under <b>Project settings</b>, register a web app and copy its <code>firebaseConfig</code> values for the next step."
                        items: []
                - type: "paragraph"
                  data:
                    text: "<b>2. Add your Firebase config</b>"
                - type: "paragraph"
                  data:
                    text: "Replace the placeholder values in <code>root.config.ts</code> with your web app's config:"
              time: 1790730406815
              version: "2.28.2"
            blocks:
              - _type: "CodeBlock"
                language: "ts"
                code: |-
                  // @/root.config.ts

                  cmsPlugin({
                    id: 'starter',
                    name: 'Starter',
                    // From Project settings > Your apps in the Firebase console.
                    firebaseConfig: {
                      apiKey: '...',
                      authDomain: 'my-project.firebaseapp.com',
                      projectId: 'my-project',
                      storageBucket: 'my-project.appspot.com',
                    },
                  }),
                _arrayKey: "HqEvgl"
              - _type: "CopyBlock"
                body:
                  blocks:
                    - type: "paragraph"
                      data:
                        text: "The <code>id</code> namespaces your content in Firestore, so several sites can share one Firebase project. Before you deploy, also replace <code>sessionCookieSecret</code> with a long random value. See <a href=\"/docs/cms/\">CMS configuration</a> for every option."
                    - type: "paragraph"
                      data:
                        text: "<b>3. Sign in to Google Cloud</b>"
                    - type: "paragraph"
                      data:
                        text: "The server reads and writes Firestore with <a href=\"https://cloud.google.com/docs/authentication/application-default-credentials\">application default credentials</a>. For local development, sign in with the gcloud CLI:"
                  time: 1790730406815
