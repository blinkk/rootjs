                language: "ts"
                code: |-
                  // @/collections/Pages.schema.ts

                  schema.array({
                    id: 'modules',
                    label: 'Modules',
                    of: schema.oneOf({
                      // Every `templates/<Name>/<Name>.schema.ts` file is available here.
                      types: schema.glob('/templates/*/*.schema.ts'),
