                    - type: "paragraph"
                      data:
                        text: "Run <code>init-firebase</code> to apply the CMS's Firestore security rules and give your account the ADMIN role:"
                  time: 1790730406815
                  version: "2.28.2"
              - _type: "CodeBlock"
                language: "bash"
                code: "pnpm exec root-cms init-firebase --admin=you@example.com"
              - _type: "CopyBlock"
                body:
                  blocks:
                    - type: "paragraph"
                      data:
                        text: "This replaces any existing Firestore rules in the project. To review the rules or apply them by hand, see <a href=\"/docs/cms/#security-rules\">Security rules</a>."
                    - type: "paragraph"
                      data:
                        text: "<b>5. Create your home page</b>"
                    - type: "paragraph"
                      data:
                        text: "Restart the dev server and open <a href=\"http://localhost:4007/cms/\">http://localhost:4007/cms/</a>. In the <code>Pages</code> collection, create a doc with the slug <code>index</code>, add a <b>Hero</b> and a <b>Text</b> module, and publish it. It replaces the setup page at <code>/</code>. Other slugs map to their own URL, e.g. <code>about</code> renders at <code>/about</code>."
                  time: 1790730406815
                  version: "2.28.2"
          - id: "templates"
            title: "Build pages from templates"
            body:
              blocks:
                - type: "paragraph"
                  data:
                    text: "Each page in the starter is a list of modules. The <code>Pages</code> collection offers every template schema in the <code>templates/</code> folder with <code>schema.glob()</code>:"
              time: 1790730406816
              version: "2.28.2"
            blocks:
              - _type: "CodeBlock"
                language: "ts"
                code: |-
                  // @/collections/Pages.schema.ts

                  schema.array({
                    id: 'modules',
                    label: 'Modules',
                    of: schema.oneOf({
                      // Every `templates/<Name>/<Name>.schema.ts` file is available here.
                      types: schema.glob('/templates/*/*.schema.ts'),
                    }),
                  }),
              - _type: "CopyBlock"
                body:
                  blocks:
                    - type: "paragraph"
                      data:
                        text: "The route at <code>routes/[[...slug]].tsx</code> loads the doc for the URL with <code>RootCMSClient</code>, and <code>PageModules</code> renders each module with the component that matches its template name. Editors can preview drafts by adding <code>?preview=true</code> to the URL."
                    - type: "paragraph"
                      data:
                        text: "To add a template, create a folder in <code>templates/</code> with a schema and a component of the same name. For example, here's the starter's <code>Text</code> template:"
                  time: 1790730406815
                  version: "2.28.2"
              - _type: "CodeBlock"
                language: "ts"
                code: |-
                  // @/templates/Text/Text.schema.ts

                  import {schema} from '@blinkk/root-cms';

                  export default schema.define({
                    name: 'Text',
                    description: 'Heading and body copy.',
                    fields: [
                      schema.string({
                        id: 'title',
                        label: 'Title',
                        translate: true,
                      }),
                      schema.string({
                        id: 'body',
                        label: 'Body',
                        help: 'Separate paragraphs with a blank line.',
                        translate: true,
                        variant: 'textarea',
                      }),
                    ],
                  });
              - _type: "CodeBlock"
                language: "tsx"
                code: |-
                  // @/templates/Text/Text.tsx

                  import {useTranslations} from '@blinkk/root';
                  import {TextFields} from '@/root-cms.js';
                  import styles from './Text.module.scss';

                  export function Text(props: TextFields) {
                    const t = useTranslations();
                    const paragraphs = t(props.body || '')
                      .split(/\n\s*\n/)
                      .filter((paragraph) => paragraph.trim());
                    return (
                      <section className={styles.text}>
                        {props.title && <h2 className={styles.title}>{t(props.title)}</h2>}
                        {paragraphs.map((paragraph) => (
                          <p>{paragraph}</p>
                        ))}
                      </section>
                    );
                  }
              - _type: "CopyBlock"
                body:
                  blocks:
                    - type: "paragraph"
                      data:
                        text: "Then regenerate the TypeScript types for your schemas. The new template shows up in the CMS the next time you open it:"
                  time: 1790730406816
                  version: "2.28.2"
              - _type: "CodeBlock"
                language: "bash"
                code: "pnpm exec root-cms generate-types"
              - _type: "CopyBlock"
                body:
                  blocks:
                    - type: "paragraph"
                      data:
                        text: "Learn more in <a href=\"/docs/cms/schemas/\">Schemas</a> and <a href=\"/docs/cms/data-fetching/\">Data fetching</a>."
                  time: 1790730406816
                  version: "2.28.2"
          - id: "secrets"
            title: "Share environment variables"
            body:
              blocks:
                - type: "paragraph"
                  data:
                    text: "API keys and other secrets belong in a <code>.env</code> file, which shouldn't be committed. To share them with your team, <code>root secrets</code> stores them in <a href=\"https://cloud.google.com/secret-manager\">Google Cloud Secret Manager</a> and keeps each developer's <code>.env</code> in sync:"
              time: 1790730406816
              version: "2.28.2"
            blocks:
              - _type: "CodeBlock"
                language: "bash"
                code: |-
                  # Create a manifest (.root.secrets.json) and commit it.
                  pnpm exec root secrets init --gcp-project=my-project --gsm-key=my-site-env

                  # Upload the values in your .env file.
                  pnpm exec root secrets push

                  # Teammates download them into their own .env.
                  pnpm exec root secrets sync
              - _type: "CopyBlock"
                body:
                  blocks:
                    - type: "paragraph"
                      data:
                        text: "Once a project has a manifest, <code>root dev</code> syncs the secrets when it starts. See the <a href=\"/docs/cli/#root-secrets\">CLI reference</a> for every command."
                  time: 1790730406816
                  version: "2.28.2"
          - id: "ai-agents"
            title: "Work with AI agents"
            body:
              blocks:
                - type: "paragraph"
                  data:
                    text: "Root.js includes skills that teach AI coding agents, such as Claude Code, how to read and edit your CMS content from the command line. Install them into your project:"
              time: 1790730406816
              version: "2.28.2"
            blocks:
              - _type: "CodeBlock"
                language: "bash"
                code: "pnpm exec root-cms skill.install"
              - _type: "CopyBlock"
                body:
                  blocks:
                    - type: "paragraph"
                      data:
                        text: "With the skills installed, an agent can look up docs with <code>root-cms client.call</code>, and propose content changes as a YAML file that your team reviews in a pull request before it's applied with <code>root-cms proposal.apply</code>."
                  time: 1790730406816
                  version: "2.28.2"
          - id: "next-steps"
            title: "Next steps"
            body:
              blocks:
                - type: "unorderedList"
                  data:
                    style: "unordered"
                    items:
                      - content: "<a href=\"/docs/project-structure/\">Project structure</a>: where routes, components and content models live."
                        items: []
                      - content: "<a href=\"/docs/routes/\">Routes</a>: file-based routing, data fetching and SSR."
                        items: []
                      - content: "<a href=\"/docs/deployment/\">Deployment</a>: ship your site as static HTML or with a server."
                        items: []
                      - content: "<a href=\"/docs/cms/schemas/\">Schemas</a>: model your content."
                        items: []
                      - content: "<a href=\"/docs/cli/\">CLI reference</a> and <a href=\"/docs/api/\">API reference</a>."
                        items: []
              time: 1790730406816
              version: "2.28.2"
            blocks: []
  - kind: "doc.edit"
    docId: "Docs/deployment"
    note: "New page: deploying a site to production, as static HTML (SSG) or with a server (SSR) on App Engine or Firebase Hosting."
    ops:
      - op: "set"
        path: "content.body"
        before:
          time: 1790683389294
          blocks:
            - type: "paragraph"
              data:
                text: "Root.js sites can be deployed in one of two ways:"
            - type: "unorderedList"
              data:
                style: "unordered"
                items:
                  - content: "<b>Static (SSG)</b>: <code>root build</code> renders every page to HTML ahead of time. Host the output on any static host or CDN."
                  - content: "<b>Server (SSR)</b>: pages are rendered on each request by a Node.js server. Root.js packages the server for <a href=\"#app-engine\">App Engine</a> and <a href=\"#firebase\">Firebase Hosting</a>, and it runs anywhere Node.js 24 does."
          version: "lexical-0.31.2"
        after:
          blocks:
            - type: "paragraph"
              data:
                text: "Root.js sites can be deployed in one of two ways:"
            - type: "unorderedList"
              data:
                style: "unordered"
                items:
                  - content: "<b>Static (SSG)</b>: <code>root build</code> renders every page to HTML ahead of time. Host the output on any static host or CDN."
                    items: []
                  - content: "<b>Server (SSR)</b>: pages are rendered on each request by a Node.js server. Root.js packages the server for <a href=\"#app-engine\">App Engine</a> and <a href=\"#firebase\">Firebase Hosting</a>, and it runs anywhere Node.js 24 does."
                    items: []
