          - id: "diffs"
            titleSize: "h5"
            title: "Human-friendly diffs"
            body:
              time: 1791001745952
              blocks:
                - type: "paragraph"
                  data:
                    text: "Reviewing changes before you publish is now much easier. Instead of a raw JSON diff, the CMS lists what changed field by field, labeled with the names from your schema, like \"Hero › Title\". Text edits are highlighted word by word, replaced images are shown side by side, and moving an item in a list shows up as a reorder rather than as every item changing."
                - type: "ImageBlock"
                  data:
                    image:
                      src: "https://lh3.googleusercontent.com/FpQXr1xULWRq1PySLpFVVbtjvTI-epK9UTMWheyDKMWt7QxRZVe8UmYqEX67ZdIrrr-Yn2fxmu8M1w6tRahNDxgIZizBWmkd8Bk"
                      width: 1920
                      height: 1200
                      alt: "The unpublished changes to a page in the Root.js CMS, listed field by field: an edited title, a word-level change to the body copy, a replaced hero image, and reordered modules."
                      gcsPath: "/rootjs-dev.appspot.com/www/uploads/9647a01a040ebb8196301fa0ca85518a6fae879b.png"
                      assetId: "CJ9wCjfi6WOQ"
                    options:
                      - "open-in-new-tab"
                    advanced: {}
                - type: "paragraph"
                  data:
                    text: "The new view appears when you review a doc's unpublished changes, in the publish modal, and when you compare versions from the version history. The raw JSON diff is still one click away."
              version: "lexical-0.31.2"
